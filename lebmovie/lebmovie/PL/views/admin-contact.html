<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Contact Messages</title>
  <link rel="stylesheet" href="../CSS/admin-contact.css">
</head>
<body>
  <h1>📩 Contact Messages (Admin Panel)</h1>
  <table id="messagesTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Message</th>
        <th>Image</th>
        <th>Reply</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="replyModal" class="modal hidden">
    <div class="modal-content">
      <h2>Send Reply</h2>
      <textarea id="replyText" rows="5" placeholder="Type your reply..."></textarea>
      <input type="email" id="adminEmail" placeholder="Admin Email" required>
      <button id="sendReplyBtn">Send Reply</button>
      <button id="closeModalBtn">Cancel</button>
    </div>
  </div>

  <script src="../Public/js/admin-contact.js"></script>
</body>
</html>
