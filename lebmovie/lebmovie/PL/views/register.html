<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Leb Movies</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- ✅ Local CSS -->
  <link rel="stylesheet" href="../CSS/register.css">
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <img src="../Public/images/lb.png" width="800" alt="Leb Movies Logo">

    <nav class="links">
      <a href="home.html">Home</a>
      <a href="movies.html">Series</a>
      <a href="#">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- REGISTER FORM -->
  <main class="login-container">
    <div class="wrapper">
      <h1>Register</h1>

      <!-- ✅ Form controlled entirely by register.js -->
      <form id="registerForm" novalidate>
        <div class="input-box">
          <input type="text" name="username" placeholder="Username" required autocomplete="username" />
        </div>

        <div class="input-box">
          <input type="email" name="email" placeholder="Email" required autocomplete="email" />
        </div>

        <div class="input-box">
          <input type="password" name="password" placeholder="Password" required autocomplete="new-password" />
        </div>

        <div class="input-box">
          <input type="password" name="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn">Register</button>

        <div class="register-link">
          <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="foot">
      <h3>Contact: 76/861896</h3>
    </div>
  </footer>

  <!-- ✅ Corrected JS path (lowercase 'public') -->
  <script src="../Public/js/register.js"></script>
</body>
</html>
