<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ✅ Local CSS -->
  <link rel="stylesheet" href="../CSS/home.css">

  <title>Leb Movies</title>
</head>

<body>
  <img 
  src="../Public/images/iconee.png" 
  id="profileIcon" 
  alt="Profile Icon"
/>
  <!-- HEADER -->
  <div class="header">
    <img src="../public/images/lb.png" width="800" alt="Leb Movies Logo">

    <div class="links">
      <a href="home.html">Home</a>
      <a href="movies.html">movies</a>
      <a href="contact.html">Contact</a>
      
      <button id="logoutBtn" class="logout">Logout</button>
    </div>
  </div>

  <h1 id="welcomeMessage" class="welcome">
    <span class="letter">WELCOME</span>
    <span class="letter" id="userName">USER</span>
  </h1>


  <!-- LANDING PAGE -->
  <div class="landpage">
    <div>
      <span>Welcome to Leb Movies</span>
      <h1>Top 1 Movies Site!</h1>
      <p>
        Leb Movies is the best movie site ever.<br>
        We provide you all movies in the world<br>
        with translations and without problems.
      </p>

      <div class="landpage-input">
        <input placeholder="Search...">
        <button>Search</button>
      </div>
    </div>

    <div class="landpage-image">
      <img id="slider" src="../public/images/j1.png.jpg" alt="Slider image">
    </div>
  </div>

  <!-- TRENDING MOVIES -->
  <div class="trend-movies">
    <div>
      <span>Trending</span>
      <div class="trending-header">
        <h1>Trending Movies</h1>
      </div>
    </div>
    <button class="btn">View All</button>
  </div>

  <!-- MOVIE CARDS -->
  <div class="cart">
    <div class="moviecard">
      <div class="imge">
        <img src="../public/images/th (2).jpeg" alt="Avatar Movie">
      </div>
      <div class="moviename">
        <div>
          <span>Avatar</span>
          <p>Action</p>
        </div>
        <div class="icone">
          <a href="https://www.youtube.com/watch?v=d9MyW72ELq0" target="_blank">
            <i class="fa fa-play-circle"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <hr>
    <div class="foot">
      <h3>Contact: 76/861896</h3>
    </div>
  </footer>

  <!-- ✅ Local JS -->
  <script src="../Public/js/home.js"></script>
</body>
</html>
